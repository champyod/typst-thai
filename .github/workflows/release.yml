name: Create Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build assets for
        required: true

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-dictionary:
    name: Build merged dictionary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.VERSION }}
      # One platform builds the trie: it is a datrie file, not native code, and
      # trietool on Windows cannot round-trip Thai through the ANSI code page,
      # so its verification step rejects correct entries.
      - name: Install trietool
        run: sudo apt install -y libthai-data libdatrie1-bin
      - name: Merge compounds
        run: THAI_BASE_TRIE=/usr/share/libthai/thbrk.tri bash compounds/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: thbrk-trie
          path: compounds/build/thbrk.tri

  build-binaries:
    name: Build ${{ matrix.target }} binary
    needs: build-dictionary
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Every platform builds on its own runner; no cross-rs image is used,
          # which is what the Apple SDK licence blocked.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: windows-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          target: ${{ matrix.target }}

      - name: Install libthai (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: sudo apt install -y libthai-dev

      - name: Install libthai (Windows)
        if: startsWith(matrix.os, 'windows-')
        shell: bash
        # libthai is autotools-only, so it yields a GNU import library and never
        # the MSVC thai.lib that link.exe requires; hence the GNU target above.
        run: |
          pacman=C:/msys64/usr/bin/pacman.exe
          "$pacman" -Sy --noconfirm
          "$pacman" -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libthai mingw-w64-ucrt-x86_64-libdatrie
          echo "PATH=C:\\msys64\\ucrt64\\bin;$(cygpath -wp "$PATH")" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:\\msys64\\ucrt64\\lib;$LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install libthai (macOS)
        if: startsWith(matrix.os, 'macos-')
        # clang ignores LIBRARY_PATH and the Homebrew prefix is off its default
        # search path, so the native library dir goes to rustc directly.
        run: |
          brew install libthai
          echo "RUSTFLAGS=-L native=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: thbrk-trie
          path: compounds/build

      - name: Run Cargo
        run: cargo build -p typst-cli --release --target ${{ matrix.target }} --features self-update

      - name: Create artifact directory
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          ARCHIVE_DIR="typst-${{ matrix.target }}"
          mkdir "$ARCHIVE_DIR"
          cp README.md LICENSE NOTICE "$ARCHIVE_DIR"
          mkdir -p "$ARCHIVE_DIR/share/libthai"
          cp compounds/build/thbrk.tri "$ARCHIVE_DIR/share/libthai"
          if [ -f "$TARGET_DIR/typst.exe" ]; then
            ARCHIVE="$ARCHIVE_DIR.zip"
            # libthai-0.dll's import table names libdatrie-1.dll, so both ship
            # beside typst.exe and a machine without MSYS2 still runs the zip.
            mkdir -p "$ARCHIVE_DIR/bin"
            cp "$TARGET_DIR/typst.exe" "$ARCHIVE_DIR/bin"
            cp C:/msys64/ucrt64/bin/libthai-0.dll "$ARCHIVE_DIR/bin"
            cp C:/msys64/ucrt64/bin/libdatrie-1.dll "$ARCHIVE_DIR/bin"
            7z a -r "$ARCHIVE" "$ARCHIVE_DIR"
          else
            ARCHIVE="$ARCHIVE_DIR.tar.xz"
            cp "$TARGET_DIR/typst" "$ARCHIVE_DIR"
            tar cJf "$ARCHIVE" "$ARCHIVE_DIR"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "$ARCHIVE" --clobber

  build-docs:
    name: Build documentation (PDF)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install libthai
        # docit links typst-docs, so this job needs libthai exactly like the
        # binary job does.
        run: sudo apt install -y libthai-dev

      - name: Compile documentation
        run: cargo docit compile --format pdf --release

      - name: Rename documentation file
        run: mv docs/dist/docs.pdf typst-documentation.pdf

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" typst-documentation.pdf --clobber
