# Based on ripgrep's release action:
# https://github.com/BurntSushi/ripgrep/blob/master/.github/workflows/release.yml

name: Create Release Assets
on:
  release:
    types: [published]

jobs:
  build-binaries:
    name: Build ${{ matrix.target }} binary
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          target: ${{ matrix.target }}

      - name: Install libthai
        # libthai-data ships thbrk.tri, which th_brk_new reads at runtime.
        run: sudo apt install -y libthai-dev libthai-data

      - name: Run Cargo
        run: cargo build -p typst-cli --release --target ${{ matrix.target }} --features self-update

      - name: Create artifact directory
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          ARCHIVE_DIR="typst-${{ matrix.target }}"
          mkdir "$ARCHIVE_DIR"
          cp README.md LICENSE NOTICE "$ARCHIVE_DIR"
          # th_brk_new falls back to the DICT_DIR compiled into libthai, an
          # absolute build-machine path that does not exist on a consumer's
          # machine, so the dictionary ships with the archive.
          mkdir -p "$ARCHIVE_DIR/share/libthai"
          cp /usr/share/libthai/thbrk.tri "$ARCHIVE_DIR/share/libthai"
          if [ -f "$TARGET_DIR/typst.exe" ]; then
            ARCHIVE="$ARCHIVE_DIR.zip"
            cp "$TARGET_DIR/typst.exe" "$ARCHIVE_DIR"
            7z a -r "$ARCHIVE" "$ARCHIVE_DIR"
          else
            ARCHIVE="$ARCHIVE_DIR.tar.xz"
            cp "$TARGET_DIR/typst" "$ARCHIVE_DIR"
            tar cJf "$ARCHIVE" "$ARCHIVE_DIR"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release upload "$VERSION" "$ARCHIVE"

  build-docs:
    name: Build documentation (PDF)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Compile documentation
        run: cargo docit compile --format pdf --release

      - name: Rename documentation file
        run: mv docs/dist/docs.pdf typst-documentation.pdf

      - name: Upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release upload "$VERSION" typst-documentation.pdf
