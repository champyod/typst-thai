name: Continuous integration
on: [push, pull_request, merge_group]

env:
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"
  PKG_CONFIG_i686-unknown-linux-gnu: /usr/bin/i686-linux-gnu-pkgconf

permissions:
  contents: read

jobs:
  # This allows us to have one branch protection rule for the full test matrix.
  # See: https://github.com/orgs/community/discussions/4324
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [test-matrix]
    if: always()
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Tests failing
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

  test-matrix:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bits: [64]
        include:
          - os: ubuntu-latest
            bits: 32
    runs-on: ${{ matrix.os }}
    steps:
      - if: matrix.bits == 32
        run: echo 'CARGO_BUILD_TARGET=i686-unknown-linux-gnu' >> $GITHUB_ENV

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Also include a list of recent commits, to regenerate missing live output.
          fetch-depth: 100
      - if: startsWith(matrix.os, 'ubuntu-') && matrix.bits == 32
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          # libthai-data ships thbrk.tri, which th_brk_new reads at runtime.
          sudo apt install -y gcc-multilib g++-multilib libssl-dev:i386 pkg-config:i386 libthai-dev:i386 libthai-data
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: ${{ matrix.bits == 32 && 'i686-unknown-linux-gnu' || startsWith(matrix.os, 'windows-') && 'x86_64-pc-windows-gnu' || '' }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.bits }}
      - name: Install libthai
        if: startsWith(matrix.os, 'ubuntu-') && matrix.bits == 64
        # libthai-data ships thbrk.tri, which th_brk_new reads at runtime.
        run: sudo apt install -y libthai-dev libthai-data
      - name: Install libthai
        if: startsWith(matrix.os, 'windows-')
        shell: bash
        # libthai is autotools-only, so it yields a GNU import library and never
        # the MSVC thai.lib that link.exe requires; hence the GNU target below.
        run: |
          pacman=C:/msys64/usr/bin/pacman.exe
          "$pacman" -Sy --noconfirm
          "$pacman" -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libthai
          echo "PATH=C:\\msys64\\ucrt64\\bin;$(cygpath -wp "$PATH")" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=C:\\msys64\\ucrt64\\lib;$LIBRARY_PATH" >> "$GITHUB_ENV"
          # The compiled-in DICT_DIR is an absolute build-machine path, and the
          # DLL-relative fallback needs a loaded DLL that a static link never has.
          echo "THAI_DICT_PATH=C:\\msys64\\ucrt64\\share\\libthai\\thbrk.tri" >> "$GITHUB_ENV"
      - name: Install libthai
        if: startsWith(matrix.os, 'macos-')
        # The Homebrew formula installs thbrk.tri into the prefix's share/libthai,
        # which is the directory compiled into the library, so no dictionary
        # override is needed on this platform.
        #
        # The prefix has to go to rustc as a native search path: clang does not
        # honour LIBRARY_PATH the way gcc does, and /opt/homebrew is off
        # clang's default search path on Apple Silicon. Appending to RUSTFLAGS
        # keeps the workflow's -Dwarnings.
        run: |
          brew install libthai
          echo "RUSTFLAGS=$RUSTFLAGS -L native=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build and run the test suite
        shell: bash
        # The flag has to vanish entirely on Linux: `cargo test --target` with an
        # empty value is an error, so it cannot be interpolated conditionally.
        run: |
          target=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            target="--target x86_64-pc-windows-gnu"
          fi
          cargo test --workspace --no-run $target
          cargo test --workspace --no-fail-fast $target
        env:
          # Only generate annotations from one matrix configuration.
          USE_GITHUB_ANNOTATIONS: ${{ startsWith(matrix.os, 'ubuntu-') && matrix.bits == 64 }}

      - name: Generate missing live output and regenerate the test report
        if: always()
        shell: bash
        run: |
          target=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            target="--target x86_64-pc-windows-gnu"
          fi
          # The testit alias hardcodes `--`, so a cargo flag cannot be appended
          # after it; the wrapper is invoked directly to keep the flag on cargo.
          cargo run --quiet --package=test-wrapper $target -- regen --rerun ${{ (job.status == 'success' && github.event_name == 'pull_request') && format('--base-revision={0}', github.event.pull_request.base.sha) || '' }}

      - name: Upload test store
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tests-store-${{ matrix.os }}-${{ matrix.bits }}
          path: |
            tests/store/by-hash
            tests/store/render
            tests/store/pdftags
            tests/store/html
          compression-level: 9
          retention-days: 7

      - name: Upload test report
        # When the CI passes, only upload one test report, since all should be the same.
        if: failure() || (success() && github.event_name == 'pull_request' && startsWith(matrix.os, 'ubuntu-') && matrix.bits == 64)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tests-report-${{ matrix.os }}-${{ matrix.bits }}
          path: tests/store/report.html
          compression-level: 9

  checks:
    name: Check clippy, formatting, and crate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo clippy --workspace --all-targets --all-features
      # These crates have cargo features, so we check them separately, or else
      # feature unification may mask errors.
      - run: cargo clippy --package typst-cli --no-default-features
      - run: cargo clippy --package typst-kit --no-default-features
      - run: cargo clippy --package typst-timing --no-default-features
      - run: cargo fmt --check --all
      - run: cargo doc --workspace --no-deps --document-private-items
      - run: git diff --exit-code

  docs:
    name: Check documentation (website and PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install libthai
        # libthai-data ships thbrk.tri, which th_brk_new reads at runtime.
        run: sudo apt install -y libthai-dev libthai-data
      - run: cargo docit compile --format website --deny-warnings
      - run: cargo docit compile --format pdf --deny-warnings

  min-version:
    name: Check minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo check --workspace --all-targets --all-features

  fuzz:
    name: Check fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2025-10-28
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Install libthai
        # libthai-data ships thbrk.tri, which th_brk_new reads at runtime.
        run: sudo apt install -y libthai-dev libthai-data
      - run: cargo install --locked cargo-fuzz@0.12.0
      - run: cd tests/fuzz && cargo fuzz build --dev

  miri:
    name: Check unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          components: miri
          toolchain: nightly-2025-10-28
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo miri test -p typst-library test_miri
